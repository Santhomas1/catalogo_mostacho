<body><main><p class="brand">MOSTACHO 3D</p><h1>Nos falta conexión.</h1><p>Conectate a Internet para ver el catálogo actualizado, preparar tu consulta o ingresar a la administración.</p><p>No podemos confirmar precios ni disponibilidad sin conexión. Esta pantalla no borra tu carrito.</p><button type="button" id="retry">Volver a intentar</button></main><script>document.getElementById('retry').addEventListener('click',function(){window.location.reload()})</script></body>
